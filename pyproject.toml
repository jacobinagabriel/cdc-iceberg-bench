[project]
name = "cdc-iceberg-bench"
version = "0.1.0"
description = "CDC pipelines from PostgreSQL into Apache Iceberg on AWS, compared on latency and cost"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The code runs on AWS Lambda (Python 3.12) and Glue 5.0 (Python 3.11).
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit",
    "pyspark==3.5.*", # Glue 5.0's Spark
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is left to ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
